name: repository quality gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  clone-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 shellcheck \
            glslang-tools spirv-tools
          python3 -m venv /tmp/qwen-apu-quality-gates
          /tmp/qwen-apu-quality-gates/bin/pip install \
            mypy==1.19.1 ruff==0.14.11

      - name: Prepare the isolated gate checkout
        run: |
          git worktree add --detach "$RUNNER_TEMP/qwen-apu-gate" HEAD
          # Ubuntu restricts unprivileged namespaces on the ephemeral runner.
          # The gate uses a private PID namespace with its matching procfs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore accepted gate cell cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/qwen-gate-cache
          key: repository-gate-cells-${{ runner.os }}
          restore-keys: |
            repository-gate-cells-${{ runner.os }}-

      - name: Run clone-local gates
        id: gate
        env:
          PATH: /tmp/qwen-apu-quality-gates/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          QWEN_CHROMIUM: google-chrome
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gate_status=0
          fast_status=3
          echo 'full_gate_ran=false' >> "$GITHUB_OUTPUT"
          echo 'cache_promoted=false' >> "$GITHUB_OUTPUT"
          if test "${{ github.event_name }}" = pull_request &&
            test "${{ github.event.pull_request.draft }}" = false; then
            echo 'pull_request_gate=full reason=pull_request_is_merge_ready'
          elif test "${{ github.event_name }}" = pull_request; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              | sort -u > "$RUNNER_TEMP/qwen-changed-files"
            fast_status=0
            python3 remote/run-pull-request-gate.py \
              --changed-files "$RUNNER_TEMP/qwen-changed-files" \
              --result-root "$RUNNER_TEMP/qwen-gate-results" \
              --worktree "$RUNNER_TEMP/qwen-apu-gate" || fast_status=$?
          elif test "${{ github.event_name }}" = push && test "${{ github.ref_name }}" = main; then
            fast_status=0
            python3 remote/merged-pr-gate-reuse.py \
              --event-name "${{ github.event_name }}" \
              --ref-name "${{ github.ref_name }}" \
              --pushed-sha "${{ github.sha }}" \
              --repository "${{ github.repository }}" \
              --api-url "${{ github.api_url }}" \
              --source-result "$RUNNER_TEMP/qwen-gate-reuse-source.tsv" || fast_status=$?
            if test "$fast_status" -eq 0; then
              source_run_id=$(awk -F '\t' '$1 == "source_run_id" { print $2 }' \
                "$RUNNER_TEMP/qwen-gate-reuse-source.tsv")
              source_run_attempt=$(awk -F '\t' '$1 == "source_run_attempt" { print $2 }' \
                "$RUNNER_TEMP/qwen-gate-reuse-source.tsv")
              case $source_run_id:$source_run_attempt in
                *[!0-9:]* | :* | *:) fast_status=3 ;;
                *)
                  import_root="$RUNNER_TEMP/qwen-pr-gate-cache-import"
                  artifact_name="repository-gate-cache-$source_run_id-$source_run_attempt"
                  if gh run download "$source_run_id" \
                    --name "$artifact_name" --dir "$import_root" &&
                    test -d "$import_root/cells"; then
                    mkdir -p "$RUNNER_TEMP/qwen-gate-cache/cells"
                    cp -a "$import_root/cells/." "$RUNNER_TEMP/qwen-gate-cache/cells/"
                    echo 'cache_promoted=true' >> "$GITHUB_OUTPUT"
                  else
                    fast_status=3
                  fi
                  ;;
              esac
            fi
          fi
          if test "$fast_status" -eq 3; then
            echo 'full_gate_ran=true' >> "$GITHUB_OUTPUT"
            remote/run-repository-gate.sh \
              -r "$RUNNER_TEMP/qwen-gate-results" \
              -c "$RUNNER_TEMP/qwen-gate-cache" \
              "$RUNNER_TEMP/qwen-apu-gate" || gate_status=$?
          elif test "$fast_status" -ne 0; then
            gate_status=$fast_status
          fi
          for gate_result in "$RUNNER_TEMP"/qwen-gate-results/*/result.tsv; do
            test -f "$gate_result" || continue
            cat "$gate_result"
            if test "$gate_status" -ne 0; then
              tail -n 100 "${gate_result%/*}/gate.log"
            fi
          done
          exit "$gate_status"

      - name: Save accepted gate cell cache
        if: >-
          steps.gate.outcome == 'success' &&
          (steps.gate.outputs.full_gate_ran == 'true' ||
           steps.gate.outputs.cache_promoted == 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/qwen-gate-cache
          key: repository-gate-cells-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain accepted gate cell cache for exact-tree promotion
        if: steps.gate.outcome == 'success' && steps.gate.outputs.full_gate_ran == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-gate-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-gate-cache
          if-no-files-found: error
          retention-days: 7

      - name: Retain the gate terminal result and log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qwen-gate-results/*/result.tsv
            ${{ runner.temp }}/qwen-gate-results/*/gate.log
          if-no-files-found: warn
