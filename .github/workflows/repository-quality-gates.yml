name: repository quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clone-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m venv /tmp/qwen-apu-quality-gates
          /tmp/qwen-apu-quality-gates/bin/pip install ruff==0.14.11

      - name: Run clone-local gates
        env:
          PATH: /tmp/qwen-apu-quality-gates/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: remote/repository-quality-gates.sh
