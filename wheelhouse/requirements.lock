# The third-party closure of qwen-apu, one distribution deep and pinned by digest.
#
# `bootstrap.py` installs this file with `--no-index --find-links wheelhouse
# --require-hashes`, so the appliance resolves the bytes beside it rather than
# an index, and a wheel whose digest moved refuses the install rather than
# replacing what was measured. pypdf is pure Python and declares no runtime
# dependency on this interpreter, which is what keeps the closure one line long.
#
# Regenerate with:
#     pip download pypdf --no-deps -d wheelhouse/
#     pip hash wheelhouse/pypdf-<version>-py3-none-any.whl
