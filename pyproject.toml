[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-apu"
version = "0.1.0"
description = "Shell-free Python control plane around native Vulkan inference engines for the Raven2 appliance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# pypdf carries the PDF text extractor `qwen_apu.tools.document_worker` imports
# at call time; `wheelhouse/requirements.lock` pins the same version by digest.
dependencies = ["pypdf==6.18.1"]

[project.scripts]
qwen-apu = "qwen_apu.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_apu = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PL"]
ignore = ["PLR0913", "PLR2004", "S101", "PLR0912", "PLR0915", "PLR0911", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["qwen_apu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
