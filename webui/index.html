<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qwen-apu</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  llama-server serves this front end from --path, so the laptop runs no second
  web service or graphical process. The browser runs on the SSH client machine;
  the Raven2 APU keeps its shared DDR4 and graphics queues for inference and the
  existing desktop. The pinned build omits upstream's embedded SvelteKit assets
  but retains the static-file and OpenAI-compatible API routes.

  Reasoning is shown, folded, beside the answer. A model can spend a whole small
  token budget reasoning and return empty answer content. The separate display
  distinguishes that result from a dead server.

  A text file is tokenized by this server before it is attached. The count comes
  from the loaded Qwen tokenizer rather than a prose character ratio. There is
  no file API: the browser reads the bytes and places them in the prompt, and
  the server refuses a prompt that exceeds the active context.

  Server timings are preferred when the stream supplies them. Browser-derived
  rates remain interactive diagnostics rather than admitted benchmark results.
  The native Vulkan backend uses LOW-priority bounded submissions so desktop
  graphics can preempt inference work.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --fg: #1a1a19; --dim: #6b6a66; --line: #e2e0da;
    --mine: #eceae4; --warn: #8a5a00; --bad: #a03020;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --fg:#e6e5e2; --dim:#9a9892; --line:#2c2c32;
            --mine:#23232a; --warn:#d0a040; --bad:#e08070; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:.6rem 1rem; border-bottom:1px solid var(--line); display:flex;
           gap:1rem; align-items:center; flex-wrap:wrap; }
  header b { font-weight:600; }
  header span { color:var(--dim); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:1rem; }
  .turn { max-width:min(52rem,100%); }
  .turn.me { align-self:flex-end; background:var(--mine); padding:.5rem .8rem; border-radius:.6rem; }
  .who { font-size:12px; color:var(--dim); margin-bottom:.2rem; }
  .body { white-space:pre-wrap; overflow-wrap:anywhere; }
  details.think { margin:.3rem 0 .5rem; border-left:2px solid var(--line); padding-left:.6rem; }
  details.think summary { cursor:pointer; color:var(--dim); font-size:13px; }
  details.think .body { color:var(--dim); font-size:13px; }
  pre.tool { background:var(--mine); padding:.5rem .7rem; border-radius:.4rem;
             overflow-x:auto; font-size:13px; margin:.4rem 0; }
  .meta { font-size:12px; color:var(--dim); margin-top:.3rem; }
  .meta.bad { color:var(--bad); }
  footer { border-top:1px solid var(--line); padding:.6rem 1rem; display:flex;
           flex-direction:column; gap:.5rem; }
  #attached { display:flex; gap:.5rem; flex-wrap:wrap; }
  .chip { font-size:12px; background:var(--mine); border-radius:.4rem; padding:.2rem .5rem;
          display:flex; gap:.4rem; align-items:center; }
  .chip.over { color:var(--bad); }
  .chip button { border:0; background:none; color:inherit; cursor:pointer; font-size:14px; padding:0; }
  .row { display:flex; gap:.5rem; align-items:flex-end; }
  textarea { flex:1; resize:none; font:inherit; padding:.5rem .7rem; border-radius:.5rem;
             border:1px solid var(--line); background:var(--bg); color:var(--fg); min-height:2.6rem; }
  button.act { font:inherit; padding:.5rem .9rem; border-radius:.5rem; border:1px solid var(--line);
               background:var(--mine); color:var(--fg); cursor:pointer; }
  button.act:disabled { opacity:.5; cursor:default; }
  input.key { width:13rem; margin-left:auto; }
  input.key, select.model-picker { font:13px system-ui,sans-serif; padding:.35rem .5rem;
              border:1px solid var(--line); border-radius:.4rem; background:var(--bg); color:var(--fg); }
  label.file { cursor:pointer; }
  input[type=file] { display:none; }
</style>
</head>

<body>

<header>
  <b>qwen-apu</b>
  <span id="model">connecting</span>
  <select class="model-picker" id="model-picker" aria-label="Model" hidden></select>
  <span id="ctx">context pending</span>
  <span>Raven2 UMA | LOW-priority Vulkan | service-latency guarded</span>
  <input class="key" type="password" id="api-key" placeholder="API key (only if the server asks)" autocomplete="off">
  <button class="act" id="set-key">set key</button>
  <label class="chip"><input type="checkbox" id="reasoning"> reasoning</label>
  <label class="chip"><input type="checkbox" id="tools"> offer a demo tool</label>
  <button class="act" id="clear">clear</button>
</header>

<div id="log"></div>

<footer>
  <div id="attached"></div>
  <div class="row">
    <label class="file chip">attach
      <input type="file" id="file" multiple accept="text/*,.md,.txt,.log,.csv,.json,.py,.c,.h,.rs,.sh">
    </label>
    <textarea id="input" rows="1" placeholder="Ask. Shift+Enter for a newline."></textarea>
    <button class="act" id="send">send</button>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const logEl = $('#log');
let history = [];
let attachments = [];   // {name, text, tokens}
let nctx = null;
let busy = false;
let requestModel = null;
let bootGeneration = 0;

function readBrowserStorage(storageName, key) {
  try { return window[storageName].getItem(key); } catch { return null; }
}

function writeBrowserStorage(storageName, key, value) {
  try {
    if (value === null) window[storageName].removeItem(key);
    else window[storageName].setItem(key, value);
  } catch { /* storage denial leaves the live page state authoritative */ }
}

let apiKey = readBrowserStorage('sessionStorage', 'qwen-apu-api-key') || '';
$('#api-key').value = apiKey;

// Reasoning costs decode tokens at about one per second on this APU, so the
// choice persists across reloads rather than resetting to on each visit.
$('#reasoning').checked =
  readBrowserStorage('localStorage', 'qwen-apu-reasoning') === 'on';
$('#reasoning').addEventListener('change', () => {
  writeBrowserStorage(
    'localStorage', 'qwen-apu-reasoning',
    $('#reasoning').checked ? 'on' : 'off');
});

function authHeaders(additional = {}) {
  const headers = { ...additional };
  if (apiKey) headers.Authorization = `Bearer ${apiKey}`;
  return headers;
}

$('#set-key').onclick = () => {
  apiKey = $('#api-key').value.trim();
  writeBrowserStorage(
    'sessionStorage', 'qwen-apu-api-key', apiKey || null);
  $('#model').textContent = apiKey ? 'key set; connecting' : 'connecting';
  void boot();
};
$('#api-key').addEventListener('keydown', event => {
  if (event.key === 'Enter') $('#set-key').click();
});

async function serverTokenCount(text) {
  const selectedModel = requestModel;
  if (!selectedModel) throw new Error('no routable model is selected');
  const response = await fetch('./tokenize', {
    method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ model: selectedModel, content: text, add_special: false })
  });
  if (!response.ok) throw new Error(`tokenizer returned HTTP ${response.status}`);
  const result = await response.json();
  if (!Array.isArray(result.tokens)) throw new Error('tokenizer returned no token array');
  return result.tokens.length;
}

const DEMO_TOOL = [{
  type: "function",
  function: {
    name: "get_weather",
    description: "Current weather for a named city.",
    parameters: {
      type: "object",
      properties: {
        city: { type: "string", description: "City name" },
        unit: { type: "string", enum: ["celsius", "fahrenheit"] }
      },
      required: ["city"]
    }
  }
}];

async function boot() {
  // The router creates no qwen-apu compatibility alias. Its roster is the
  // authority for request ids, so the fallback page selects only a model that
  // the listener reports instead of assuming the single-model alias exists.
  const generation = ++bootGeneration;
  const modelPicker = $('#model-picker');
  requestModel = null;
  nctx = null;
  modelPicker.hidden = true;
  $('#ctx').textContent = 'context pending';

  try {
    const rosterResponse = await fetch('./v1/models', { headers: authHeaders() });
    if (generation !== bootGeneration) return;
    if (rosterResponse.status === 401) {
      $('#model').textContent =
        apiKey ? 'API key rejected' : 'this server wants an API key';
      return;
    }
    if (!rosterResponse.ok) {
      $('#model').textContent = `/v1/models returned HTTP ${rosterResponse.status}`;
      return;
    }
    const roster = await rosterResponse.json();
    if (generation !== bootGeneration) return;
    const rosterModels = Array.isArray(roster.data) ? roster.data : [];
    const modelIds = [...new Set(rosterModels
      .map(model => model?.id)
      .filter(modelId => typeof modelId === 'string' && modelId.length > 0))];
    if (!modelIds.length) {
      $('#model').textContent = 'server reports no routable model';
      return;
    }

    const storedModel = readBrowserStorage('localStorage', 'qwen-apu-model-id');
    requestModel = modelIds.includes(storedModel) ? storedModel : modelIds[0];
    modelPicker.textContent = '';
    for (const modelId of modelIds) {
      const option = document.createElement('option');
      option.value = modelId;
      option.textContent = modelId;
      modelPicker.append(option);
    }
    modelPicker.value = requestModel;
    modelPicker.hidden = false;
    $('#model').textContent = `${modelIds.length} model${modelIds.length === 1 ? '' : 's'} available`;

    try {
      const propsResponse = await fetch('./props', { headers: authHeaders() });
      if (generation !== bootGeneration) return;
      if (propsResponse.ok) {
        const props = await propsResponse.json();
        if (generation !== bootGeneration) return;
        nctx = props.default_generation_settings?.n_ctx ?? props.n_ctx ?? null;
      }
    } catch {
      if (generation !== bootGeneration) return;
      nctx = null;
    }
    $('#ctx').textContent = nctx
      ? nctx.toLocaleString() + ' token context'
      : 'context reported after model load';
    renderAttached();
  } catch (error) {
    if (generation !== bootGeneration) return;
    requestModel = null;
    modelPicker.hidden = true;
    $('#model').textContent = `cannot load model roster: ${error.message || error}`;
  }
}
void boot();

$('#model-picker').addEventListener('change', event => {
  requestModel = event.target.value;
  writeBrowserStorage('localStorage', 'qwen-apu-model-id', requestModel);
});

function chip(text, over, onRemove) {
  const c = document.createElement('span');
  c.className = 'chip' + (over ? ' over' : '');
  c.append(text);
  const b = document.createElement('button');
  b.textContent = 'remove';
  b.onclick = onRemove;
  c.append(b);
  return c;
}

function renderAttached() {
  const box = $('#attached');
  box.textContent = '';
  let total = 0;
  attachments.forEach(a => total += a.tokens);
  attachments.forEach((a, i) => {
    const over = nctx && total > nctx * 0.9;
    box.append(chip(
      `${a.name} -- ${a.tokens.toLocaleString()} tokens`,
      over, () => { attachments.splice(i, 1); renderAttached(); }));
  });
  if (attachments.length && nctx && total > nctx * 0.9) {
    const w = document.createElement('span');
    w.className = 'chip over';
    w.textContent = `about ${total.toLocaleString()} tokens against a ${nctx.toLocaleString()} context; the server will refuse this with a 400`;
    box.append(w);
  }
}

$('#file').onchange = async e => {
  for (const f of e.target.files) {
    const text = await f.text();
    try {
      const tokens = await serverTokenCount(text);
      attachments.push({ name: f.name, text, tokens });
    } catch (error) {
      window.alert(`Could not attach ${f.name}: ${error.message || error}`);
    }
  }
  e.target.value = '';
  renderAttached();
};

function turn(who, cls) {
  const d = document.createElement('div');
  d.className = 'turn' + (cls ? ' ' + cls : '');
  const w = document.createElement('div');
  w.className = 'who'; w.textContent = who;
  const b = document.createElement('div');
  b.className = 'body';
  d.append(w, b);
  logEl.append(d);
  logEl.scrollTop = logEl.scrollHeight;
  return { root: d, body: b };
}

$('#clear').onclick = () => { history = []; logEl.textContent = ''; };

$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#send').onclick = send;

async function send() {
  if (busy) return;
  if (!requestModel) {
    $('#model').textContent = 'no routable model is selected';
    return;
  }
  const text = $('#input').value.trim();
  if (!text && !attachments.length) return;

  let prompt = text;
  for (const f of attachments) {
    prompt = `--- ${f.name} ---\n${f.text}\n--- end ${f.name} ---\n\n` + prompt;
  }
  const content = prompt;

  const shown = text + (attachments.length
    ? '\n' + attachments.map(a => `[${a.name}]`).join(' ') : '');
  turn('you', 'me').body.textContent = shown;
  history.push({ role: 'user', content });
  $('#input').value = '';
  attachments = [];
  renderAttached();

  busy = true; $('#send').disabled = true;
  const t = turn('qwen');
  const think = document.createElement('details');
  think.className = 'think';
  const sum = document.createElement('summary');
  sum.textContent = 'reasoning';
  const tb = document.createElement('div');
  tb.className = 'body';
  think.append(sum, tb);
  let thinkShown = false;
  const meta = document.createElement('div');
  meta.className = 'meta';
  t.root.append(meta);

  const body = { model: requestModel, stream: true, temperature: 0.7,
                 stream_options: { include_usage: true },
                 max_tokens: 512, messages: history };
  const reasoningOn = $('#reasoning').checked;
  // Qwen3 emits its <think> block from the chat template, so the switch is a
  // template argument. reasoning_budget 0 ends the block immediately on builds
  // that read the OpenAI-side field instead, and both are ignored by a
  // template that does not offer the option.
  body.chat_template_kwargs = { enable_thinking: reasoningOn };
  if (!reasoningOn) body.reasoning_budget = 0;
  if ($('#tools').checked) body.tools = DEMO_TOOL;

  const t0 = performance.now();
  let first = null, streamChunks = 0, completionTokens = null;
  let serverTimings = null, answer = '', reasoning = '', finish = null;
  const toolCalls = {};
  try {
    const resp = await fetch('./v1/chat/completions', {
      method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const detail = await resp.text();
      throw new Error(`HTTP ${resp.status}. ${detail.slice(0, 300)}`);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        if (line === 'data: [DONE]') continue;
        let d; try { d = JSON.parse(line.slice(6)); } catch { continue; }
        if (d.usage?.completion_tokens !== undefined) completionTokens = d.usage.completion_tokens;
        if (d.timings) serverTimings = d.timings;
        const ch = d.choices?.[0]; if (!ch) continue;
        if (ch.finish_reason) finish = ch.finish_reason;
        const delta = ch.delta || {};
        for (const tc of delta.tool_calls || []) {
          const k = tc.index ?? 0;
          toolCalls[k] ||= { name: '', args: '' };
          if (tc.function?.name) toolCalls[k].name += tc.function.name;
          if (tc.function?.arguments) toolCalls[k].args += tc.function.arguments;
        }
        if (delta.reasoning_content) {
          if (first === null) first = performance.now();
          streamChunks++; reasoning += delta.reasoning_content; tb.textContent = reasoning;
          if (!thinkShown) { t.root.insertBefore(think, t.body); thinkShown = true; }
        }
        if (delta.content) {
          if (first === null) first = performance.now();
          streamChunks++; answer += delta.content; t.body.textContent = answer;
        }
        logEl.scrollTop = logEl.scrollHeight;
      }
    }
  } catch (err) {
    meta.className = 'meta bad';
    meta.textContent = String(err.message || err);
    busy = false; $('#send').disabled = false;
    return;
  }

  const calls = Object.values(toolCalls);
  if (calls.length) {
    const pre = document.createElement('pre');
    pre.className = 'tool';
    pre.textContent = calls.map(c => `${c.name}(${c.args})`).join('\n');
    t.root.insertBefore(pre, meta);
  }

  const total = (performance.now() - t0) / 1000;
  const ttft = first ? (first - t0) / 1000 : null;
  const browserDecodeSeconds = first ? (performance.now() - first) / 1000 : null;
  const rate = serverTimings?.predicted_per_second ??
    (browserDecodeSeconds && completionTokens ? completionTokens / browserDecodeSeconds : null);
  const bits = [];
  if (serverTimings?.prompt_per_second !== undefined) {
    bits.push(`${serverTimings.prompt_per_second.toFixed(1)} tok/s prefill`);
  } else if (ttft !== null) {
    bits.push(`time to first token ${ttft.toFixed(2)}s`);
  }
  if (rate !== null) bits.push(`${rate.toFixed(1)} tok/s decode`);
  if (completionTokens !== null) {
    bits.push(`${completionTokens} generated tokens in ${total.toFixed(1)}s`);
  } else {
    bits.push(`${streamChunks} streamed chunks in ${total.toFixed(1)}s`);
  }
  // A non-stop finish is a budget or a tool hand-off, not a wrong answer, and
  // saying so is the difference between reading a truncation as a model failure
  // and reading it as a harness limit.
  if (finish && finish !== 'stop') bits.push(`ended on ${finish}`);
  if (!answer && reasoning) bits.push('the answer is empty; the model spent the budget reasoning');
  meta.textContent = bits.join(' | ');

  const msg = { role: 'assistant', content: answer };
  if (calls.length) {
    msg.tool_calls = calls.map((c, i) => ({
      id: `call_${i}`, type: 'function',
      function: { name: c.name, arguments: c.args }
    }));
  }
  history.push(msg);
  busy = false; $('#send').disabled = false;
  $('#input').focus();
}
</script>
</body>
</html>
