<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qwen-apu</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  The landing page chooses a surface and holds nothing else. Each choice is a
  whole page at its own address: Chat is llama.cpp's own built page on the
  second listener, and Image is this appliance's generator on the third, so a
  reader lands on the surface itself rather than on a frame of it.

  `GET /api/status` names both addresses, as `gateway.llama_ui_origin` and
  `gateway.image_ui_origin`, so the ports come from the launch rather than
  from arithmetic on this page's own port. A launch that binds neither leaves
  its card stating so, which is the honest answer where a dead link would be
  a wrong one.
-->
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<main>
  <h1>qwen-apu</h1>
  <p class="tagline">Local inference on the appliance.</p>
  <nav class="choices">
    <a id="choice-chat" class="choice" href="#" aria-describedby="chat-note">
      <span class="glyph" aria-hidden="true">&#9993;</span>
      <span class="label">Chat</span>
      <span id="chat-note" class="note">Text, vision, documents, web search</span>
      <span class="where" id="chat-where"></span>
    </a>
    <a id="choice-image" class="choice" href="#" aria-describedby="image-note">
      <span class="glyph" aria-hidden="true">&#9635;</span>
      <span class="label">Image</span>
      <span id="image-note" class="note">Generate and keep pictures</span>
      <span class="where" id="image-where"></span>
    </a>
  </nav>
  <section id="approvals" class="approvals" aria-label="pending tool approvals" aria-live="polite"></section>
  <footer>
    <span id="landing-status" class="status" data-state="reading">reading status</span>
    <a class="quiet-link" href="legacy/">legacy page</a>
  </footer>
</main>
<script type="module" src="js/launcher.js"></script>
</body>
</html>
